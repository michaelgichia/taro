name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build --if-present

      - name: Publish package
        run: npm publish --access public

      - name: Post changelog to release issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CHANGELOG_FILE="$(mktemp)"
          node scripts/generate-changelog.cjs --to "$RELEASE_TAG" > "$CHANGELOG_FILE"

          ISSUE_NUMBER="$(gh issue list --state open --search "\"release: ${RELEASE_TAG}\" in:title" --limit 1 --json number --jq '.[0].number')"

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER="$(gh issue list --label release --state open --limit 1 --json number --jq '.[0].number')"
          fi

          if [ -n "$ISSUE_NUMBER" ]; then
            {
              printf '## Published %s\n\n' "$RELEASE_TAG"
              printf 'Successfully published to npm in [%s](%s).\n\n' "$GITHUB_RUN_ID" "$WORKFLOW_URL"
              cat "$CHANGELOG_FILE"
            } > /tmp/release-comment.md

            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/release-comment.md
            gh issue close "$ISSUE_NUMBER" --comment "Release ${RELEASE_TAG} completed in workflow run ${GITHUB_RUN_ID}."
          fi
