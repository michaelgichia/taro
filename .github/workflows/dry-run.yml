name: Release Dry Run

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run --if-present build

      - name: Verify changelog generation
        run: pnpm run changelog

      - name: Verify package publish payload
        run: pnpm publish --dry-run --access public --no-git-checks

      - name: Summary
        run: |
          {
            echo "## Dry run successful"
            echo
            echo "- Tests passed"
            echo "- Build completed"
            echo "- Changelog generated"
            echo "- Publish payload verified with pnpm dry-run"
            echo "- Trusted publishing workflow is ready on GitHub-hosted runners"
          } >> "$GITHUB_STEP_SUMMARY"
