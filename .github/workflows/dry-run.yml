name: Release Dry Run

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run --if-present build

      - name: Verify changelog generation
        run: pnpm run changelog

      - name: Verify package publish payload
        run: pnpm publish --dry-run --access public --no-git-checks

      - name: Pack tarball for install-smoke
        run: pnpm pack --pack-destination ./packed

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: taro-tarball
          path: packed/*.tgz
          retention-days: 1

      - name: Summary
        run: |
          {
            echo "## Dry run successful"
            echo
            echo "- Tests passed"
            echo "- Build completed"
            echo "- Changelog generated"
            echo "- Publish payload verified with pnpm dry-run"
            echo "- Trusted publishing workflow is ready on GitHub-hosted runners"
          } >> "$GITHUB_STEP_SUMMARY"

  install-smoke:
    name: install-smoke (${{ matrix.pm }})
    needs: test-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn, bun]
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Set up pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Enable corepack for yarn
        if: matrix.pm == 'yarn'
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Set up bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: taro-tarball
          path: ./packed

      - name: Resolve tarball path
        id: resolve
        run: |
          tarball=$(ls ./packed/*.tgz | head -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Invoke installer with --version
        env:
          TARBALL: ${{ steps.resolve.outputs.tarball }}
        run: |
          set -euxo pipefail
          case "${{ matrix.pm }}" in
            npm)
              npx --yes "$TARBALL" --version
              ;;
            pnpm)
              pnpm dlx "$TARBALL" --version
              ;;
            yarn)
              # yarn berry's dlx requires a registry spec; fall back to npx for tarball inputs.
              npx --yes "$TARBALL" --version
              ;;
            bun)
              bunx "$TARBALL" --version
              ;;
          esac
